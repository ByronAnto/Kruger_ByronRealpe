<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for</title>
    
</head>

<body>
    <h1> Tablas de multiplicar: </h1>

    <button onclick="generarTablas()">test</button> <br>

    <p id="resultado"></p>
    <script>
        const generarTablas = () => {
            let resultado = "<table border='1'>";
            for (let i = 1; i <= 10; i++) { 
                resultado += "<tr>";
                for (let j = 1; j <= 10; j++) { 
                    resultado += "<td>" + i + " * " + j + " = " + (i * j) + "</td>";
                }
                resultado += "</tr>";
            }
            resultado += "</table>";
            console.log(resultado);
            document.getElementById("resultado").innerHTML = resultado;
        }
    </script>

</body>

</html>
