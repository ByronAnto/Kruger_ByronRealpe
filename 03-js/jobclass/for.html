<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for</title>
</head>
<body>
    <h1> ciclo For</h1> <br> <br>
    <h2> Resultado de for: </h2>
<p id="resultado"></p>

    <script> 
        for (let i = 0; i < 10; i++) {
            document.getElementById("resultado").innerHTML += i+1 + "<br>";            
            console.log(i);
        }


    </script>
    
</body>
</html>
