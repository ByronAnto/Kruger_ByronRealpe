<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 3</title>

    <style>

        .gradiente {
            width: 200px;
            height: 100px;
            background: linear-gradient(100deg, red, blue);
            margin-inline: auto;
            box-shadow: brown 5px 5px 5px;
            animation-name: animationOne;
            animation-duration: 5;
            animation-iteration-count: 10;
        }
        p{
            text-shadow:chartreuse 2px 2px 2px;
        }
        @keyframes animationOne {
         from{ background-color: green;}
         to{ background-color: blue;}
        }
    </style>
</head>
<body>
    
 <div class="gradiente">
<p>Hola Mund</p> </div>
</body>
</html>
